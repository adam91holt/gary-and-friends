name: CI

on:
  pull_request:

# CI only reads the repo and runs gates; no extra permissions needed.
permissions:
  contents: read

# Supersede stale gate runs when a PR head moves.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Typecheck, test, lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: bun run typecheck

      # Scoped to src/: bare `bun test` also picks up the Playwright specs in
      # e2e/, which can only run under `playwright test` (see CLAUDE.md).
      - name: Unit tests
        run: bun test src/

      - name: Lint
        run: bun run lint
