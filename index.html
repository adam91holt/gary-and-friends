<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gary and his Friends</title>
    <style>
      /* ── Design tokens ─────────────────────────────────────────────────
         Dark-first surfaces, a single owned accent (Gary orange) at the token
         layer, and a deliberate type scale (2 stacks, real sizes). Every
         component reads from these — no one-off hexes in the overlay. */
      :root {
        --bg: #0e0e18;
        --bg-2: #14141f;
        /* Card surface must carry legibility on its own — backdrop-filter is a
           bonus, never the thing standing between text and the moving road. */
        --surface: rgba(16, 16, 27, 0.93);
        --surface-hud: rgba(18, 18, 30, 0.78);
        --surface-solid: #14141f;
        --hairline: rgba(255, 255, 255, 0.08);
        --hairline-strong: rgba(255, 255, 255, 0.16);

        /* The one owned accent, plus its glow + a warmer companion. */
        --accent: #ff7a1a;
        --accent-2: #ffb347;
        --accent-ink: #1a0f04;
        --accent-glow: rgba(255, 122, 26, 0.45);
        --danger: #ff4d5e;

        /* THE motif, owned at the token layer: the diagonal orange/white
           hazard band off a real traffic cone. It caps every card, rails the
           instrument bar and frames the record plaque, so the overlay and the
           cone on the road are visibly the same object. Never re-declare these
           stripes in a component — read the token. */
        --hazard: repeating-linear-gradient(
          -45deg,
          var(--accent) 0 10px,
          #f7f2ea 10px 20px
        );
        --hazard-dim: repeating-linear-gradient(
          -45deg,
          rgba(255, 122, 26, 0.5) 0 8px,
          rgba(247, 242, 234, 0.42) 8px 16px
        );

        /* The five friends, mirrored numerically in src/theme.ts (FRIEND_TINTS)
           so the roster chip in the HUD and the cone in the scene are the same
           colour by construction. An accent-FAMILY palette on purpose — the
           convoy reads as Gary's crew, never as another hue competing with him. */
        --friend-1: #ffd7a1;
        --friend-2: #d9743f;
        --friend-3: #f4e9d6;
        --friend-4: #ffc266;
        --friend-5: #c2542f;

        --text: #f5f5fa;
        --text-dim: #9a9ab2;
        --text-faint: #62627a;

        /* Paired characterful stacks: a tight geometric display face and a
           mono face for instrument-style telemetry numerals. */
        --font-display: "Space Grotesk Variable", "Space Grotesk", "Segoe UI",
          system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
        --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono",
          Menlo, Consolas, monospace;

        /* Type scale — a handful of real steps forming hierarchy. */
        --fs-hero: clamp(2.75rem, 9vw, 5.5rem);
        --fs-title: clamp(2rem, 5vw, 3rem);
        --fs-readout: clamp(1.5rem, 3.4vw, 2.1rem);
        --fs-stat: 2rem;
        --fs-body: 1rem;
        --fs-label: 0.72rem;
        --fs-micro: 0.6rem;

        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-display);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
      }
      /* HUD overlay is injected by src/ui/hud.ts and sits above the canvas. */
      #hud {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
